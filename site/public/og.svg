<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="winwright — a green never covers a check that did not run">
  <defs>
    <linearGradient id="ww-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8877ff"/>
      <stop offset="1" stop-color="#4635ad"/>
    </linearGradient>
    <linearGradient id="ww-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0918"/>
      <stop offset="1" stop-color="#110d21"/>
    </linearGradient>
    <radialGradient id="ww-glow" cx="0.82" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#6F5CF0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6F5CF0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ww-bg)"/>
  <rect width="1200" height="630" fill="url(#ww-glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#6F5CF0"/>

  <!-- the mark, at 128px -->
  <g transform="translate(90,116) scale(0.8)">
    <rect width="160" height="160" rx="34" fill="url(#ww-body)"/>
    <rect x="28" y="30" width="104" height="10" rx="5" fill="#ffffff" opacity=".38"/>
    <rect x="28" y="56" width="58" height="14" rx="4" fill="#ffffff" opacity=".92"/>
    <rect x="38" y="80" width="72" height="14" rx="4" fill="#ffffff" opacity=".6"/>
    <rect x="40" y="104" width="64" height="20" rx="6" fill="none" stroke="#ffffff" stroke-width="3.4"/>
    <circle cx="124" cy="120" r="15" fill="#D29A00" stroke="#2a1f52" stroke-width="6"/>
  </g>

  <text x="238" y="176" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#ece7fb">winwright</text>
  <text x="240" y="212" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8a81ab">part of alegauss</text>

  <text x="90" y="356" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="bold" fill="#ece7fb">A green never covers</text>
  <text x="90" y="428" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="bold" fill="#a396ff">a check that did not run.</text>

  <!-- measured at 958px against the 1020px between the gutters; the previous
       line ran 48px past x=1110 -->
  <text x="92" y="494" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#ada4cd">Drive a Windows desktop app from a test, and report what was observed.</text>

  <!-- the four verdicts, as the badge -->
  <rect x="90" y="532" width="512" height="46" rx="23" fill="#181231" stroke="#322a5c"/>
  <circle cx="118" cy="555" r="6" fill="#2EA043"/>
  <circle cx="140" cy="555" r="6" fill="#E5484D"/>
  <circle cx="162" cy="555" r="6" fill="#D29A00"/>
  <circle cx="184" cy="555" r="6" fill="#B070E0"/>
  <text x="206" y="563" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#ada4cd">Passed · Failed · Degraded · Broken — and 2 is why</text>

  <text x="1110" y="563" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#8a81ab">alegauss.github.io/winwright</text>
</svg>
