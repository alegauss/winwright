name: CI

# The engine targets net10.0-windows and its tests create real windows, so there is no runner
# choice to make here: windows-latest or nothing. A Linux job would not even restore.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, so it is cancelled rather
# than left to finish and report on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # global.json pins 10.0.303 with rollForward latestPatch; reading it here is what keeps the
      # runner's SDK and the developer's from being two different answers.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Winwright.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props, so a warning fails here on purpose.
      - name: Build
        run: dotnet build Winwright.slnx --configuration Release --no-restore

      # WW117 and WW138: one step, because the roll call is part of running the suite rather than a
      # step beside it. A host that dies mid-run takes its remaining tests with it and the runner
      # still prints a pass — measured here at 352 of 374, a green covering twenty-two tests that
      # never ran. This used to be three steps, and the middle one is what every developer types.
      - name: Test
        run: >
          dotnet test tests/Winwright.Tests/Winwright.Tests.csproj
          --configuration Release
          --no-build

      # WW122: the two halves are packages or they are a path into this repository, and a path is
      # unpinnable by construction. Packing here is what makes the claim checkable rather than
      # intended. WW230 decided where they go — nuget.org, from publish.yml — and this still packs on
      # every push, because a pack that only happens at release time is one that first fails there.
      - name: Pack
        run: dotnet pack Winwright.slnx --configuration Release --no-build --output packages

      # The block's first criterion, as a project rather than a paragraph: an application under
      # test takes the in-app half by one package reference and by nothing else. It restores from
      # what was just packed, so a type that is public in the tree and absent from the package
      # fails here and nowhere else.
      - name: Build the adopter against the package
        run: dotnet build samples/Adopter/Adopter.csproj --configuration Release

      # WW228: the driving half, and it is a separate step because it proves a separate thing. The
      # application above proves one package reference reaches the in-app half; this proves a project
      # can live underneath it without being compiled into it. Delete the DefaultItemExcludes line in
      # Adopter.csproj and the step above fails, which is what makes the line a rule rather than a
      # note somebody wrote after losing an afternoon to it.
      - name: Build the adopter's driving half against the package
        run: dotnet build samples/Adopter/driving/Driving.csproj --configuration Release

      # WW142: the copies of the engine in play, read against each other, with the exit code the
      # agreement reading has carried since WW70 and nothing ever left behind. It runs after Pack
      # because one of the copies is what the build actually produced, and before the packages are
      # kept because a disagreement is not an artifact worth publishing. The adopter's pinned
      # version is a literal somebody has to remember to bump - this is what remembers.
      #
      # WW239 deliberately did not fold this into publish.yml's COPIES, and the boundary is worth
      # stating. That line is where the version lives for an adopter, and it owns both halves of a
      # release: the same flags raise the copies and read them back, so one nobody added is in
      # neither. This line is about what a build produced - the assembly this process loaded, and the
      # two packages just packed - which is a question about the run rather than about the tree, and
      # is asked on every push rather than on a release. Two lists that could drift is the defect;
      # two questions is not.
      - name: Check the copies of the engine agree
        run: >
          dotnet exec tools/Winwright.Concordance/bin/Release/net10.0-windows/Winwright.Concordance.dll
          --declared Directory.Build.props
          --running
          --packed packages
          --package Winwright.InApp
          --packed packages
          --pinned samples/Adopter/Adopter.csproj

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages
          retention-days: 7

      # A red run is only useful if you can see which assertion went red, and the console log
      # truncates. The results and the discovery listing are the two halves the roll compared, so
      # both are kept — and only when there is something to read in them.
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7
