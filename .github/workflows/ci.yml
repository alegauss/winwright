name: CI

# The engine targets net10.0-windows and its tests create real windows, so there is no runner
# choice to make here: windows-latest or nothing. A Linux job would not even restore.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, so it is cancelled rather
# than left to finish and report on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # global.json pins 10.0.303 with rollForward latestPatch; reading it here is what keeps the
      # runner's SDK and the developer's from being two different answers.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Winwright.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props, so a warning fails here on purpose.
      - name: Build
        run: dotnet build Winwright.slnx --configuration Release --no-restore

      # WW117: the two lists the roll call compares. Discovery is taken from the same built
      # assembly the run uses, so a disagreement between them is about the run and not the build.
      - name: List the tests
        run: >
          dotnet test tests/Winwright.Tests/Winwright.Tests.csproj
          --configuration Release
          --no-build
          --list-tests > ${{ runner.temp }}/discovered.txt

      - name: Test
        run: >
          dotnet test Winwright.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=winwright.trx"
          --results-directory ${{ runner.temp }}/test-results

      # A host that dies mid-run takes its remaining tests with it and the step above still passes:
      # measured at 352 of 374 here, a green covering twenty-two tests that never ran. Always,
      # because the run this exists to catch is the one that already reported success.
      - name: Roll call
        if: '!cancelled()'
        run: >
          dotnet run --project tools/Winwright.RollCall/Winwright.RollCall.csproj
          --configuration Release --no-build --
          --discovered ${{ runner.temp }}/discovered.txt
          --results ${{ runner.temp }}/test-results/winwright.trx

      # A red run is only useful if you can see which assertion went red, and the console log
      # truncates. The trx is kept only when there is something to read in it.
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 7
