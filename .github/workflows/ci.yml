name: CI

# The engine targets net10.0-windows and its tests create real windows, so there is no runner
# choice to make here: windows-latest or nothing. A Linux job would not even restore.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, so it is cancelled rather
# than left to finish and report on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # global.json pins 10.0.303 with rollForward latestPatch; reading it here is what keeps the
      # runner's SDK and the developer's from being two different answers.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Winwright.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props, so a warning fails here on purpose.
      - name: Build
        run: dotnet build Winwright.slnx --configuration Release --no-restore

      # WW117 and WW138: one step, because the roll call is part of running the suite rather than a
      # step beside it. A host that dies mid-run takes its remaining tests with it and the runner
      # still prints a pass — measured here at 352 of 374, a green covering twenty-two tests that
      # never ran. This used to be three steps, and the middle one is what every developer types.
      - name: Test
        run: >
          dotnet test tests/Winwright.Tests/Winwright.Tests.csproj
          --configuration Release
          --no-build

      # WW122: the two halves are packages or they are a path into this repository, and a path is
      # unpinnable by construction. Packing here is what makes the claim checkable rather than
      # intended; publishing anywhere is a decision nobody has made.
      - name: Pack
        run: dotnet pack Winwright.slnx --configuration Release --no-build --output packages

      # The block's first criterion, as a project rather than a paragraph: an application under
      # test takes the in-app half by one package reference and by nothing else. It restores from
      # what was just packed, so a type that is public in the tree and absent from the package
      # fails here and nowhere else.
      - name: Build the adopter against the package
        run: dotnet build samples/Adopter/Adopter.csproj --configuration Release

      - name: Keep the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages
          retention-days: 7

      # A red run is only useful if you can see which assertion went red, and the console log
      # truncates. The results and the discovery listing are the two halves the roll compared, so
      # both are kept — and only when there is something to read in them.
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7
